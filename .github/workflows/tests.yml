name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # `brew test-bot --only-tap-syntax` is readall + style, and the style half
      # cannot pass here: Casks/drift.rb is generated by GoReleaser on every
      # drift release, and its template emits a blank line before the closing
      # `end`. `brew style --fix` would be undone by the next tag, and
      # test-bot has no way to skip a cop — so the two halves are run directly
      # instead, with only the layout cops that generated file trips excluded.
      # Everything substantive still fails the build: a cask that will not
      # parse, a malformed stanza, a bad sha256. Homebrew's own .rubocop.yml
      # already excludes ArgumentAlignment for Formula paths, so this follows
      # its posture rather than inventing one.
      - run: brew readall --aliases --syntax "$GITHUB_REPOSITORY"
      - run: |
          brew style \
            --except-cops Layout/EmptyLinesAroundBlockBody,Layout/ArgumentAlignment \
            "$GITHUB_REPOSITORY"

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
